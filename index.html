<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cabangile SmolLM2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 94%);
      margin: 25px auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #334155;
      font-size: 14px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }

    #response {
      min-height: 220px;
      white-space: pre-wrap;
      line-height: 1.6;
      background: #0f172a;
      border-radius: 10px;
      padding: 15px;
      overflow-wrap: break-word;
    }

    .info {
      color: #94a3b8;
      line-height: 1.7;
    }

    .progress {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🧠 Cabangile SmolLM2</h1>

    <div class="status" id="status">
      ● Starting...
    </div>
  </header>

  <div class="card">

    <h2>🎭 Drama AI</h2>

    <textarea id="prompt">Write a short drama scene about Sphelele finding a mysterious envelope in her living room.</textarea>

    <button id="generate">
      🤖 Generate with SmolLM2
    </button>

    <div class="progress" id="progress">
      Loading model...
    </div>

  </div>

  <div class="card">

    <h2>AI Response</h2>

    <div id="response">
      Preparing SmolLM2...
    </div>

  </div>

  <div class="card">

    <h2>Model Information</h2>

    <div class="info">
      Model: SmolLM2 135M Instruct<br>
      Runtime: Transformers.js<br>
      Inference: Browser<br>
      API key: None<br>
      Gemini: Not used<br>
      Server: Not required
    </div>

  </div>

</div>

<script type="module">

  import { pipeline }
    from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";

  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const response = document.getElementById("response");
  const button = document.getElementById("generate");
  const prompt = document.getElementById("prompt");

  let generator = null;

  async function loadModel() {

    try {

      status.textContent = "● Loading SmolLM2...";
      progress.textContent = "Downloading the browser model. First load may take some time...";
      response.textContent = "Loading SmolLM2 135M...";

      generator = await pipeline(
        "text-generation",
        "HuggingFaceTB/SmolLM2-135M-Instruct",
        {
          dtype: "q4"
        }
      );

      status.textContent = "● SmolLM2 READY";
      progress.textContent = "Model loaded locally in the browser.";
      response.textContent = "SmolLM2 is ready. Enter a prompt and press Generate.";

      button.disabled = false;

    } catch (error) {

      console.error(error);

      status.textContent = "● MODEL ERROR";

      progress.textContent =
        "Could not load SmolLM2.";

      response.textContent =
        "Error:\n\n" + error.message;

      button.disabled = true;
    }
  }

  button.disabled = true;

  loadModel();

  button.addEventListener("click", async () => {

    if (!generator) {
      return;
    }

    const text = prompt.value.trim();

    if (!text) {
      response.textContent = "Please enter a prompt.";
      return;
    }

    button.disabled = true;

    status.textContent = "● GENERATING";

    response.textContent = "SmolLM2 is thinking...";

    try {

      const messages = [
        {
          role: "system",
          content:
            "You are Cabangile Drama AI. Write clear, creative drama scenes with characters, actions, dialogue and settings."
        },
        {
          role: "user",
          content: text
        }
      ];

      const output = await generator(
        messages,
        {
          max_new_tokens: 200,
          temperature: 0.7,
          do_sample: true
        }
      );

      const result =
        output[0]?.generated_text;

      if (Array.isArray(result)) {

        response.textContent =
          result[result.length - 1]?.content ||
          JSON.stringify(result, null, 2);

      } else {

        response.textContent =
          result || JSON.stringify(output, null, 2);

      }

      status.textContent = "● SmolLM2 READY";
      progress.textContent = "Generation completed locally.";

    } catch (error) {

      console.error(error);

      status.textContent = "● GENERATION ERROR";

      response.textContent =
        "Generation error:\n\n" +
        error.message;

    }

    button.disabled = false;

  });

</script>

</body>
</html>
